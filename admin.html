<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام نقاط البيع والولاء - متصل بـ Firestore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبات Firebase المتوافقة -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #f8fafc; color: #1e293b; }
        .admin-card { background: white; border-radius: 1.25rem; padding: 1.25rem; border: 1px solid #e2e8f0; margin-bottom: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03); }
        .hidden { display: none !important; }
        input, select, textarea { width: 100%; padding: 0.65rem 0.85rem; border-radius: 0.65rem; border: 1px solid #cbd5e1; outline: none; background: #f8fafc; font-family: inherit; font-size: 0.85rem; }
        input:focus, select:focus { border-color: #2563eb; background: #fff; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        label { font-size: 0.75rem; font-weight: 700; color: #64748b; margin-bottom: 0.35rem; display: block; }
    </style>
</head>
<body class="max-w-3xl mx-auto pb-24 px-3 sm:px-6">

    <!-- شاشة تسجيل الدخول للربط -->
    <div id="login-screen" class="p-8 text-center mt-20 bg-white rounded-[2.5rem] shadow-2xl border max-w-md mx-auto">
        <div class="w-20 h-20 bg-blue-600 text-white rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg">
            <i class="fas fa-cash-register text-3xl"></i>
        </div>
        <h2 class="text-2xl font-black mb-6 text-slate-800">تسجيل دخول النظام</h2>
        <div class="space-y-4 text-right">
            <div>
                <label>معرف المتجر / المطعم (Cafe ID)</label>
                <input type="text" id="cafe-id-input" placeholder="مثال: store1">
            </div>
            <button onclick="AppManager.initSystem()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-bold transition-all shadow-lg cursor-pointer">دخول لوحة النقاط والبيع</button>
        </div>
    </div>

    <!-- الواجهة الرئيسية لنقاط البيع -->
    <div id="main-app" class="hidden mt-4">
        <div class="bg-slate-900 text-white p-4 rounded-2xl mb-5 flex justify-between items-center shadow-xl">
            <div>
                <p class="text-[10px] text-slate-400 font-bold uppercase">المتجر المتصل</p>
                <h1 id="display-store-name" class="font-black text-lg text-blue-400">--</h1>
            </div>
            <button onclick="location.reload()" class="text-xs text-red-400 cursor-pointer bg-transparent border-none font-bold">خروج</button>
        </div>

        <!-- قسم الكاشير السريع والمنتجات -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- قائمة المنتجات القادمة من فايرستور -->
            <div class="admin-card">
                <h3 class="font-black text-blue-600 mb-3 border-r-4 border-blue-600 pr-3">قائمة المنتجات</h3>
                <div id="products-grid" class="grid grid-cols-2 gap-2 max-h-80 overflow-y-auto p-1">
                    <p class="text-xs text-slate-400 text-center col-span-2">الرجاء الانتظار...</p>
                </div>
            </div>

            <!-- سلة المشتريات -->
            <div class="admin-card flex flex-col justify-between">
                <div>
                    <h3 class="font-black text-slate-800 mb-3 border-r-4 border-slate-800 pr-3">سلة الطلب الحالي</h3>
                    <div id="cart-items" class="space-y-2 max-h-48 overflow-y-auto mb-3 p-1">
                        <p class="text-xs text-slate-400 text-center py-6">السلة فارغة حالياً</p>
                    </div>
                </div>
                
                <div class="border-t pt-3 mt-3">
                    <div class="flex justify-between font-bold text-sm mb-3">
                        <span>إجمالي السلة:</span>
                        <span id="cart-total" class="text-blue-600 text-lg">0</span> ليرة
                    </div>
                    <button onclick="POSManager.checkout()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold shadow-lg cursor-pointer border-none transition-all">إتمام الطلب وحفظه في Firestore</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // إعدادات Firebase الخاصة بك
        const firebaseConfig = { 
            apiKey: "YOUR_API_KEY", 
            authDomain: "YOUR_AUTH_DOMAIN", 
            projectId: "YOUR_PROJECT_ID", 
            storageBucket: "YOUR_STORAGE_BUCKET", 
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID", 
            appId: "YOUR_APP_ID" 
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let cart = [];

        const AppManager = {
            cafeId: "",
            initSystem() {
                const id = document.getElementById('cafe-id-input').value.trim();
                if(!id) { alert("الرجاء إدخال معرف المتجر"); return; }
                AppManager.cafeId = id;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('display-store-name').innerText = id;
                POSManager.loadProducts();
            }
        };

        const POSManager = {
            async loadProducts() {
                const grid = document.getElementById('products-grid');
                grid.innerHTML = '<p class="text-xs text-slate-400 text-center col-span-2">جاري التحميل من Firestore...</p>';
                try {
                    const snapshot = await db.collection("cafes").doc(AppManager.cafeId).collection("products").get();
                    grid.innerHTML = "";
                    if(snapshot.empty) {
                        grid.innerHTML = '<p class="text-xs text-slate-400 text-center col-span-2">لا توجد منتجات مسجلة في قاعدة البيانات</p>';
                        return;
                    }
                    snapshot.forEach(doc => {
                        const p = doc.data();
                        const pId = doc.id;
                        grid.innerHTML += `
                        <div onclick="POSManager.addToCart('${pId}', '${p.name}', ${p.price})" class="p-3 bg-slate-50 border rounded-xl shadow-sm cursor-pointer hover:border-blue-500 hover:bg-blue-50/35 transition-all">
                            <div class="font-bold text-xs text-slate-800 truncate">${p.name}</div>
                            <div class="text-[11px] text-blue-600 font-black mt-1">${p.price} ل.س</div>
                        </div>`;
                    });
                } catch(e) {
                    console.error(e);
                    grid.innerHTML = '<p class="text-xs text-red-400 text-center col-span-2">خطأ في الاتصال بقاعدة البيانات</p>';
                }
            },
            
            addToCart(id, name, price) {
                const existing = cart.find(item => item.id === id);
                if (existing) {
                    existing.qty += 1;
                } else {
                    cart.push({ id, name, price, qty: 1 });
                }
                this.renderCart();
            },

            removeFromCart(id) {
                cart = cart.filter(item => item.id !== id);
                this.renderCart();
            },

            renderCart() {
                const container = document.getElementById('cart-items');
                const totalEl = document.getElementById('cart-total');
                if (cart.length === 0) {
                    container.innerHTML = '<p class="text-xs text-slate-400 text-center py-6">السلة فارغة حالياً</p>';
                    totalEl.innerText = '0';
                    return;
                }
                
                container.innerHTML = '';
                let total = 0;
                cart.forEach(item => {
                    total += item.price * item.qty;
                    container.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-50 p-2 rounded-lg border text-xs">
                        <div>
                            <span class="font-bold">${item.name}</span>
                            <span class="text-slate-500 mr-2">(${item.qty}x)</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-blue-600">${item.price * item.qty}</span>
                            <button onclick="POSManager.removeFromCart('${item.id}')" class="text-red-500 cursor-pointer bg-transparent border-none"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>`;
                });
                totalEl.innerText = total;
            },

            async checkout() {
                if (cart.length === 0) {
                    alert("السلة فارغة، أضف بعض المنتجات أولاً!");
                    return;
                }
                
                try {
                    const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
                    const orderData = {
                        items: cart,
                        total: totalAmount,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        status: "completed"
                    };

                    // حفظ الطلب في مجموعة orders الخاصة بالمتجر داخل Firestore
                    await db.collection("cafes").doc(AppManager.cafeId).collection("orders").add(orderData);
                    
                    alert("تم إرسال الطلب وحفظه في Firestore بنجاح! 🎉");
                    cart = [];
                    this.renderCart();
                } catch (error) {
                    console.error("خطأ أثناء إتمام الطلب: ", error);
                    alert("حدث خطأ أثناء حفظ الطلب، تأكد من الاتصال وقواعد الأمان.");
                }
            }
        };
    </script>
</body>
</html>
